name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - '.specify/**'
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.5 is what vercel-php@0.9.0 runs in production; 8.4 is what the
        # local toolchain uses. Both are tested so neither can drift unnoticed.
        php: ['8.4', '8.5']
    name: validate (PHP ${{ matrix.php }})
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8088
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      ADMIN_SEED_EMAIL: ''
      ADMIN_SEED_PASSWORD: ''
      ADMIN_SEED_NAME: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, intl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          php artisan db:seed --force

      # These three gates existed as npm scripts but were never run here, so
      # they silently rotted. They run before the slower steps so a formatting
      # or typing regression fails fast.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint:check

      - name: Check PHP formatting
        run: composer run lint:check

      - name: Run frontend type checks
        run: npm run types:check

      - name: Build frontend assets
        run: npm run build

      - name: Run backend tests
        run: php artisan test

      - name: Verify routes
        run: php artisan route:list
